services:
  postgres:
    image: postgres:16
    container_name: evee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evee
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - evee_pg_data:/var/lib/postgresql/data

volumes:
  evee_pg_data:
